name: Wrapper CI

on:
  push:
    branches:
      - hardening/darwphone-video-lifecycle
    paths:
      - "sipservice/src/main/java/**"
      - "sipservice/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/wrapper-ci.yml"
  pull_request:
    paths:
      - "sipservice/src/main/java/**"
      - "sipservice/build.gradle"
      - "build.gradle"
      - "settings.gradle"

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android compatibility fixes for legacy standalone build
        run: |
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/" sipservice/build.gradle
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :sipservice:testDebugUnitTest --stacktrace

      - name: Compile debug AAR
        run: ./gradlew :sipservice:assembleDebug --stacktrace

      - name: Compile release AAR
        run: ./gradlew :sipservice:assembleRelease --stacktrace
